<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行人通道辐射监测系统</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: "Microsoft YaHei", "微软雅黑", "Segoe UI", "PingFang SC",
                "Noto Sans CJK SC", sans-serif;
            user-select: none;
        }
        :root {
            --hmi-ok: #4caf50;
            --hmi-warn: #ff9800;
            --hmi-alarm: #ff4444;
            --hmi-info: #2196F3;
            --hmi-muted: #aaaaaa;
            --hmi-text: #ffffff;
            --hmi-panel: #2a2a2a;
            --hmi-panel-deep: #1f1f1f;
            --hmi-border: #333333;
            --hmi-bg: #1a1a1a;
            --touch-min: 44px;
            --radius: 8px;
            --radius-card: 10px;
        }
        body {
            background-color: var(--hmi-bg); color: var(--hmi-text); height: 100vh;
            display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
        }

        @keyframes alarmPulse {
            0% { background-color: rgba(255, 68, 68, 0.25); border-color: var(--hmi-alarm); box-shadow: 0 0 20px rgba(255, 68, 68, 0.6); }
            50% { background-color: rgba(255, 68, 68, 0.05); border-color: rgba(255, 68, 68, 0.4); box-shadow: 0 0 5px rgba(255, 68, 68, 0.1); }
            100% { background-color: rgba(255, 68, 68, 0.25); border-color: var(--hmi-alarm); box-shadow: 0 0 20px rgba(255, 68, 68, 0.6); }
        }
        @keyframes cardAlarmFlash {
            0% { border-color: var(--hmi-alarm); box-shadow: 0 0 25px rgba(255, 68, 68, 0.8); }
            50% { border-color: #7F1D1D; box-shadow: 0 0 5px rgba(255, 68, 68, 0.2); }
            100% { border-color: var(--hmi-alarm); box-shadow: 0 0 25px rgba(255, 68, 68, 0.8); }
        }
        @keyframes textGlowRed {
            0% { color: #ff6666; text-shadow: 0 0 20px #ff4444; }
            50% { color: #990000; text-shadow: 0 0 4px #550000; }
            100% { color: #ff6666; text-shadow: 0 0 20px #ff4444; }
        }
        @keyframes btnPulse {
            0% { box-shadow: 0 0 8px rgba(255, 68, 68, 0.4); }
            50% { box-shadow: 0 0 20px rgba(255, 68, 68, 0.8); }
            100% { box-shadow: 0 0 8px rgba(255, 68, 68, 0.4); }
        }
        @keyframes iconPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.55; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes walkThrough {
            0% { transform: translateY(10px) scale(0.8); opacity: 0; }
            50% { transform: translateY(-15px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-40px) scale(0.7); opacity: 0; }
        }

        .header {
            display: flex; flex-direction: row; flex-wrap: nowrap;
            justify-content: space-between; align-items: center;
            background: var(--hmi-panel); padding: 0 16px;
            height: 52px; min-height: 52px; max-height: 52px;
            border-bottom: 1px solid var(--hmi-border); flex-shrink: 0; overflow: hidden;
            box-sizing: border-box;
        }
        .header.global-alarm { background: #3B0707; border-bottom-color: var(--hmi-alarm); }
        .header-left, .header-right {
            display: flex; flex-direction: row; flex-wrap: nowrap;
            align-items: center; gap: 10px; min-width: 0; height: 50px;
        }
        .header-left { flex: 1 1 auto; overflow: hidden; min-width: 0; }
        .header-right { flex: 0 1 auto; margin-left: 8px; max-width: 55%; overflow: hidden; }
        .system-title {
            font-size: 15px; font-weight: 800; color: #FFF; letter-spacing: 0.3px;
            cursor: pointer; white-space: nowrap; line-height: 1.2;
            overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%;
        }
        .mode-badge {
            flex-shrink: 0; white-space: nowrap;
            background: #1E293B; color: var(--hmi-info); padding: 3px 10px;
            border-radius: 12px; font-size: 11px; font-weight: 600;
            border: 1px solid #0284C7; line-height: 1.2;
        }
        .time-tag {
            flex-shrink: 0; white-space: nowrap;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px; color: #AAA; background: #1F2026;
            padding: 3px 10px; border-radius: 4px;
            border: 1px solid #2D303E; line-height: 1.2;
        }
        .total-cps {
            color: #AAA; white-space: nowrap; font-size: 12px; line-height: 1.2;
            display: inline-flex; align-items: center; gap: 4px; min-width: 0; flex-shrink: 1; overflow: hidden;
        }
        .total-cps #totalCpsLabel { overflow: hidden; text-overflow: ellipsis; max-width: 9em; }
        .total-cps #totalCps {
            --cps-scale: 1;
            font-size: calc(18px * var(--cps-scale)); font-weight: 800;
            font-family: Consolas, "Courier New", monospace;
            color: #00FF66; text-shadow: 0 0 8px rgba(0,255,102,0.3); flex-shrink: 1;
            min-width: 0; white-space: nowrap;
        }
        .status-online {
            flex-shrink: 0; white-space: nowrap;
            background: #064E3B; color: #34D399; padding: 4px 10px; border-radius: 4px;
            border: 1px solid #059669; font-weight: bold; font-size: 11px; line-height: 1.2;
        }
        .status-warn { background: #78350F; color: #FBBF24; border-color: #B45309; }
        .status-offline { background: #7F1D1D; color: #FCA5A5; border-color: #991B1B; }
        .hdr-tools {
            display: flex; flex-direction: row; align-items: center; gap: 8px;
            flex-shrink: 0; margin-left: 4px;
        }
        .battery-tag {
            color: #DDD; font-size: 12px; font-weight: 600; white-space: nowrap;
            padding: 3px 8px; background: #222430; border: 1px solid #323545; border-radius: 4px;
        }
        .lang-btn {
            min-width: 48px; height: 40px; min-height: var(--touch-min);
            padding: 0 12px;
            background: #333333; color: #ff9800; border: 1px solid #ff9800;
            border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
            line-height: 38px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .lang-btn:active { background: #ff9800; color: #111; }
        .ghost-login {
            width: 44px;
            height: 44px;
            min-width: var(--touch-min);
            min-height: var(--touch-min);
            border-radius: 8px;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(34,36,48,0.75);
            color: rgba(170,176,190,0.8);
            font-size: 18px;
            line-height: 42px;
            text-align: center;
            cursor: pointer;
            opacity: 0.85;
            flex-shrink: 0;
            margin-left: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .ghost-login:active {
            opacity: 1;
            color: #E5E7EB;
            border-color: rgba(56,189,248,0.5);
            background: rgba(40,44,56,0.95);
        }
        body.nav-enabled .ghost-login { display: none !important; }
        body.nav-enabled .original-probe-card { cursor: pointer; }
        body.can-reorder .original-probe-card { cursor: grab; touch-action: none; }
        .original-probe-card.dragging {
            opacity: 0.55; transform: scale(0.98);
            box-shadow: 0 0 0 2px var(--hmi-info);
            z-index: 5;
        }
        .original-probe-card.drag-over {
            border-color: var(--hmi-info) !important;
            box-shadow: 0 0 0 2px rgba(56,189,248,0.55);
        }

        
        .header .brand-title, #systemTitle {
            font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
        }
        #totalCps {
            font-size: calc(18px * var(--cps-scale, 1)) !important; font-weight: 800; color: #00FF66;
            font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
        }
        #masterLink {
            font-size: 11px !important; font-weight: 700;
            max-width: 12em; overflow: hidden; text-overflow: ellipsis;
        }
        #batteryTag, #langBtn {
            font-size: 12px !important;
        }

        .main-container {
            flex: 1; display: grid;
            grid-template-columns: minmax(0, 7fr) minmax(320px, 3fr);
            gap: 12px; padding: 12px; min-height: 0;
            align-items: stretch;
            height: 100%;
        }
        .primary-section {
            display: flex; flex-direction: column; gap: 12px; min-height: 0;
            height: 100%;
        }
        /* Banner : probes = 1 : 1 */
        .channel-master-card {
            flex: 0 0 auto;
            min-height: 0;
            max-height: 148px;
            background: var(--hmi-panel); border: 1px solid var(--hmi-border); border-radius: 8px;
            padding: 10px 14px; display: flex; flex-direction: row;
            align-items: center; justify-content: space-between; gap: 14px;
        }
        .master-alarm-banner {
            flex: 1; display: flex; flex-direction: row; justify-content: flex-start; align-items: center;
            text-align: left; padding: 10px 16px; border-radius: 8px;
            background: rgba(16, 185, 129, 0.10); border: 2px solid rgba(16, 185, 129, 0.55);
            transition: all 0.3s ease; min-height: 88px; max-height: 120px; min-width: 0; gap: 14px;
        }
        .master-alarm-banner .banner-text-col {
            display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; flex: 1;
        }
        .master-alarm-banner.alarm { animation: alarmPulse 0.8s infinite; }
        .master-alarm-banner.warn { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.5); }
        .alarm-title-text {
            font-size: 22px; font-weight: 900; color: var(--hmi-ok); letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: flex-start; gap: 12px;
            line-height: 1.2;
        }
        .master-alarm-banner.alarm .alarm-title-text { color: #FF3333; }
        .master-alarm-banner.warn .alarm-title-text { color: var(--hmi-warn); }
        .alarm-icon-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 56px; height: 56px; min-width: 56px; padding: 0; border-radius: 50%;
            font-size: 28px; font-weight: 900; line-height: 1;
            font-family: "Segoe UI Symbol", "Segoe UI Emoji", "Microsoft YaHei", sans-serif;
            background: rgba(16, 185, 129, 0.22); color: var(--hmi-ok);
            border: 3px solid rgba(16, 185, 129, 0.75);
            flex-shrink: 0; box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }
        .master-alarm-banner.alarm .alarm-icon-badge {
            width: 64px; height: 64px; min-width: 64px; font-size: 34px;
            background: rgba(239, 68, 68, 0.28); color: #FF4D4D;
            border-color: var(--hmi-alarm); border-radius: 12px;
            box-shadow: 0 0 22px rgba(239, 68, 68, 0.55);
            animation: iconPulse 0.8s infinite;
        }
        .master-alarm-banner.warn .alarm-icon-badge {
            width: 60px; height: 60px; min-width: 60px; font-size: 30px;
            background: rgba(245, 158, 11, 0.25); color: var(--hmi-warn);
            border-color: var(--hmi-warn); border-radius: 12px;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.4);
        }
        /* SVG warning glyph inside badge when alarming */
        .alarm-icon-badge svg { width: 70%; height: 70%; display: block; }
        .master-alarm-banner.alarm .alarm-icon-badge {
            background: rgba(239, 68, 68, 0.25); color: #FF4D4D; border-color: var(--hmi-alarm);
            animation: iconPulse 0.8s infinite;
        }
        .master-alarm-banner.warn .alarm-icon-badge {
            background: rgba(245, 158, 11, 0.25); color: var(--hmi-warn); border-color: var(--hmi-warn);
        }
        .alarm-sub-text { font-size: 13px; color: var(--hmi-muted); margin-top: 0; font-weight: 500; max-width: 100%; line-height: 1.3; }
        .master-alarm-banner.alarm .alarm-sub-text { color: #FFAAAA; font-weight: bold; }

        .gate-visual-box {
            flex-shrink: 0; display: flex; flex-direction: row; align-items: center;
            gap: 14px; padding-left: 4px;
        }
        .gate-frame {
            width: 78px; height: 70px; border: 3px solid var(--hmi-warn); border-bottom: none;
            border-radius: 8px 8px 0 0; position: relative;
            display: flex; align-items: flex-end; justify-content: center;
            background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%);
        }
        .person-avatar {
            font-size: 34px; font-weight: 800; color: var(--hmi-warn); line-height: 1;
            font-family: "Segoe UI Symbol", "Segoe UI Emoji", "Microsoft YaHei", sans-serif;
            position: absolute; bottom: 8px; letter-spacing: 0;
        }
        .person-avatar.passing { animation: walkThrough 1.5s infinite linear; }
        .passage-state-badge {
            padding: 10px 18px; border-radius: 22px; font-size: 15px; font-weight: bold;
            background: #232530; color: #C5C8D4; border: 1px solid #3A3E4C; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 8px;
            min-height: var(--touch-min); box-sizing: border-box;
            font-family: "Segoe UI Emoji", "Segoe UI Symbol", "Microsoft YaHei", sans-serif;
        }
        .passage-state-badge.active {
            background: var(--hmi-warn); color: #000; border-color: var(--hmi-warn);
            box-shadow: 0 0 12px rgba(245,158,11,0.4);
        }
        .passage-state-badge.alarm {
            background: #ff4444; color: #fff; border-color: #ff4444;
            box-shadow: 0 0 12px rgba(255,68,68,0.45);
        }
        .passage-state-badge.offline {
            background: rgba(255,152,0,0.18); color: #ff9800; border-color: #ff9800;
        }

        .probes-section {
            flex: 1 1 0;
            display: flex; flex-direction: column; gap: 8px;
            min-height: 0;
            max-height: none;
        }
        .section-header {
            font-size: 15px; font-weight: 800; color: var(--hmi-muted);
            letter-spacing: 1px; flex-shrink: 0; text-transform: none;
        }
        .probes-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            flex: 1; min-height: 0;
            align-content: stretch;
            grid-auto-rows: 1fr;
        }

        .original-probe-card {
            background: var(--hmi-panel); border: 2px solid var(--hmi-border); border-radius: var(--radius-card);
            padding: 12px 14px;
            display: grid; grid-template-rows: auto 1fr auto;
            cursor: pointer; transition: border-color 0.2s;
            min-height: 0; max-height: none; height: 100%; overflow: hidden;
        }
        .original-probe-card:hover { border-color: var(--hmi-info); }
        .original-probe-card.alarm { background: #210A0C; animation: cardAlarmFlash 0.8s infinite; }
        .original-probe-card.offline { border-color: #555; opacity: 0.85; }
        .probe-head {
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; margin-bottom: 4px;
        }
        .probe-name { font-size: 16px; font-weight: bold; color: #F1F5F9; }
        .probe-location-tag {
            background: #222430; color: #A4A7B5; padding: 4px 10px; border-radius: 4px;
            font-size: 12px; border: 1px solid #2D3040;
            max-width: 48%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .probe-body {
            grid-row: 2;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 6px 0; min-height: 0;
            width: 100%; overflow: hidden;
        }
        .probe-cps-row {
            display: inline-flex; align-items: baseline; justify-content: center;
            gap: 6px; flex-wrap: nowrap; width: 100%; max-width: 100%;
            min-width: 0; padding: 0 4px; box-sizing: border-box;
            overflow: hidden;
        }
        .probe-cps-row.stacked {
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .probe-num {
            --cps-scale: 1;
            font-size: calc(clamp(22px, 6.2vh, 72px) * var(--cps-scale));
            font-weight: 800;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            color: #00FF66; text-shadow: 0 0 18px rgba(0, 255, 102, 0.40);
            line-height: 1; letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            flex: 0 1 auto; min-width: 0;
            white-space: nowrap;
        }
        .original-probe-card.alarm .probe-num { animation: textGlowRed 0.8s infinite; }
        .original-probe-card.offline .probe-num { color: #888; text-shadow: none; }
        .probe-unit-label {
            font-size: clamp(12px, 2vh, 24px); color: #8490A0;
            font-weight: 600; letter-spacing: 0.5px;
            flex: 0 0 auto; line-height: 1;
            padding-bottom: 0.12em; white-space: nowrap;
        }
        .probe-cps-row.stacked .probe-unit-label {
            padding-bottom: 0;
            font-size: clamp(11px, 1.6vh, 18px);
        }
        .original-probe-card.alarm .probe-unit-label { color: #B45309; }
        .original-probe-card.offline .probe-unit-label { color: #666; }
        .probe-foot {
            grid-row: 3;
            display: flex; justify-content: flex-start; align-items: center;
            border-top: 1px solid #232532; padding-top: 10px; margin-top: 6px;
            font-size: 15px; color: var(--hmi-muted); flex-shrink: 0; font-weight: 600;
            gap: 10px; min-height: 28px;
        }
        .status-indicator { gap: 8px !important; }
        .status-indicator > span:not(.dot) { letter-spacing: 0.5px; }
        .status-indicator { gap: 8px !important; }
        .status-indicator > span:not(.dot) { letter-spacing: 0.5px; }
        .status-indicator { display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #00FF66; box-shadow: 0 0 8px #00FF66; flex-shrink: 0; }
        .dot.alarm { background: var(--hmi-alarm); box-shadow: 0 0 8px var(--hmi-alarm); animation: iconPulse 0.8s infinite; }
        .dot.offline { background: #666; box-shadow: none; }
        .status-text-green { color: #00FF66; }
        .status-text-red { color: var(--hmi-alarm); font-weight: bold; }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            height: 100%;
            min-width: 320px;
            overflow: hidden;
            box-sizing: border-box;
        }
        /* Strict 1:1:1 equal height */
        #card_alarm, #card_health, #card_fault {
            flex: 1 1 0% !important;
            min-height: 0 !important;
            max-height: none !important;
            overflow: hidden !important;
            align-self: stretch;
            box-sizing: border-box;
            position: relative;
        }
        .sidebar-section > .debug-bar {
            flex: 0 0 auto !important;
            height: auto !important;
            max-height: none !important;
            margin-top: 0;
        }
        .side-card {
            background: var(--hmi-panel); border: 1px solid var(--hmi-border); border-radius: 8px;
            padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        .side-card > .info-list {
            flex: 0 0 auto !important;
            overflow: hidden;
        }
        .side-card > .side-card-title { flex: 0 0 auto; }
        .side-card > .reset-btn {
            flex: 0 0 auto;
            margin-top: auto;
        }
.side-card.warn { border-color: rgba(245, 158, 11, 0.85); border-width: 2px; }
        .side-card.danger { border-color: var(--hmi-alarm); border-width: 2px; }
        .clickable-card { cursor: default; transition: border-color 0.2s ease; position: relative; padding-bottom: 0; }
        body.nav-enabled .clickable-card { cursor: pointer; }
        body.nav-enabled .clickable-card:hover {
            border-color: var(--hmi-info); background: #191B22;
        }
        /* Public: fault card opens alarm log; health card still clickable (login then diagnostics) */
        body.alarm-log-enabled #card_health,
        body.alarm-log-enabled #card_fault { cursor: pointer; }
        body.alarm-log-enabled #card_health:hover,
        body.alarm-log-enabled #card_fault:hover {
            border-color: var(--hmi-info); background: #191B22;
        }
        .detail-link { display: none !important; }

        .kv-list {
            display: flex; flex-direction: column; gap: 10px;
            flex: 1 1 auto; min-height: 0; justify-content: flex-start;
            overflow: hidden; padding: 8px 0 4px;
        }
        .kv-row {
            display: grid;
            grid-template-columns: 88px 1fr;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            line-height: 1.35;
            min-height: 24px;
        }
        .kv-key { color: var(--hmi-muted); flex-shrink: 0; font-size: 13px; }
        .kv-val {
            color: var(--hmi-text); font-weight: 700; text-align: right;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0; font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .kv-val.green { color: var(--hmi-ok); }
        .kv-val.amber { color: var(--hmi-warn); }
        .kv-val.muted { color: var(--hmi-muted); }
        .kv-val.multiline {
            white-space: pre-line;
            overflow: hidden;
            text-align: right;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            line-height: 1.35;
        }
        .detail-link {
            position: absolute; right: 14px; bottom: 10px;
            background: transparent; border: none; padding: 6px 2px;
            color: var(--hmi-info); font-size: 13px; font-weight: 700;
            cursor: pointer; letter-spacing: 0.2px;
            min-height: 32px;
        }
        .detail-link:hover { color: #60A5FA; text-decoration: underline; }

        .side-card-title {
            font-size: 15px; font-weight: 800; color: #D5D7E0;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #22242C; padding-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .side-card-title > span:last-child {
            font-size: 13px; font-weight: 700;
        }
        .info-list {
            display: flex; flex-direction: column; gap: 10px;
            font-size: 14px; flex: 1 1 auto; min-height: 0;
            justify-content: flex-start; padding: 8px 0 4px;
        }
        .info-item {
            display: flex; justify-content: space-between; align-items: center;

        .info-item > span:first-child { flex-shrink: 0; min-width: 72px; }
        .info-value {
            color: var(--hmi-text); font-weight: 700; text-align: right;
            max-width: 100%; flex: 1; min-width: 0; line-height: 1.5;
            font-size: 14px;
        }
        #healthDesc {
            max-width: 100%;
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-size: 11px;
            letter-spacing: 0;
            line-height: 1.3;
        }
        #lastFaultText {
            max-width: 100%;
            flex: 1 1 auto;
            min-width: 0;
            font-size: 13px;
            letter-spacing: 0;
            line-height: 1.35;
        }
        .info-item:has(#healthDesc) {
            gap: 6px;
            flex: 0 0 auto;
            min-height: 0;
        }
        .info-item:has(#healthDesc) > span:first-child {
            min-width: 36px;
        }
        .info-value.green { color: var(--hmi-ok); }
        .info-value.amber { color: var(--hmi-warn); }
        .info-value.red-flash { color: #FF4D4D; font-weight: bold; animation: textGlowRed 0.8s infinite; }

        .reset-btn {
            width: 100%; min-height: var(--touch-min); height: 48px; border-radius: 8px;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: all 0.3s ease; margin-top: auto;
            flex-shrink: 0; letter-spacing: 0.5px;
        }
        .reset-btn.normal { background: #1C1E26; border: 1px solid #2D303E; color: #6B7280; opacity: 0.8; }
        .reset-btn.normal:hover { background: #252836; color: #9CA3AF; border-color: #3B3E52; }
        .reset-btn.active {
            background: linear-gradient(135deg, var(--hmi-alarm) 0%, #c62828 100%);
            border: 1px solid var(--hmi-alarm); color: #FFFFFF;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); animation: btnPulse 1.2s infinite;
        }
        .reset-btn:disabled { cursor: not-allowed; opacity: 0.55; }

        .debug-bar {
            background: var(--hmi-panel); border: 1px solid var(--hmi-border); border-radius: 8px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: auto;
        }
        body.embedded .sidebar-section {
            /* three visible cards only; debug-bar display:none */
        }
        body.embedded .debug-bar { display: none !important; flex: 0 !important; height: 0 !important; max-height: 0 !important; margin: 0 !important; padding: 0 !important; border: none !important; overflow: hidden !important; }
        .debug-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .debug-btn {
            background: #222430; color: #AAA; border: 1px solid #323545;
            padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer;
        }
        .debug-btn:hover { background: #2C2F40; color: #FFF; }
        .debug-btn.alarm-btn { background: #7F1D1D; color: #FCA5A5; border-color: #991B1B; }

        .page-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 11, 14, 0.92); z-index: 1000;
            display: none; justify-content: center; align-items: center;
        }

        .modal-box {

            border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; overflow: hidden;
        }

            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-size: 16px; font-weight: bold; color: #FFF; }
        .close-btn {
            background: #2A2D3A; border: none; color: #AAA;
            width: 44px; height: 44px; min-width: var(--touch-min); min-height: var(--touch-min);
            border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .close-btn:active { background: var(--hmi-alarm); color: #FFF; }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto; }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1A1C23; padding: 12px 16px; border-radius: 6px; border: 1px solid #252834;
        }
        .status-tag-ok { background: #064E3B; color: #34D399; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-tag-warn { background: #78350F; color: #FBBF24; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        @media (max-width: 900px) {
            body { overflow-y: auto; height: auto; }
            .main-container { grid-template-columns: 1fr; }
            .probes-grid { grid-template-columns: 1fr; }
            .channel-master-card { flex-direction: column; }
            .gate-visual-box { justify-content: space-between; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header" id="mainHeader">
        <div class="header-left">
            <span class="system-title" id="systemTitle" title="双击登录">行人通道辐射监测系统</span>

                    <div class="banner-text-col">

                        </div>

                    </div>
                </div>

                    <div class="gate-frame">
                        <div class="person-avatar" id="personIcon">🚪</div>
                    </div>

                </div>

            <div class="side-card clickable-card" id="card_health" onclick="openPage('health')">

                </div>
                <div class="kv-list">
                    <div class="kv-row"><span class="kv-key" id="kvProbeComm">探头通信</span><span class="kv-val muted" id="healthProbeComm">0/2 待接入</span></div>
                    <div class="kv-row"><span class="kv-key" id="kvIrStatus">传感器</span><span class="kv-val muted" id="healthIrStatus">未接入</span></div>
                    <div class="kv-row"><span class="kv-key" id="kvMasterHw">主控硬件</span><span class="kv-val muted" id="healthMasterHw">未接入</span></div>
                </div>

                </div>
                <div class="kv-list">

                    <button class="debug-btn" onclick="setProbeCount(4)">4 探头</button>

    <div class="page-modal" id="pageModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">详情</div>
                <button class="close-btn" onclick="closePage()">X</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let bridge = null;
        let embedded = false;
        var canNavigate = false;
        var canOpenAlarmLog = true;
        let probes = [
            { id: 1, name: 'Probe 1', location: 'Left · Upper', cps: 0, threshold: 1000, isAlarm: false, online: true, clientId: null },
            { id: 2, name: 'Probe 2', location: 'Right · Upper', cps: 0, threshold: 1000, isAlarm: false, online: true, clientId: null },
            { id: 3, name: 'Probe 3', location: 'Left · Lower', cps: 0, threshold: 1000, isAlarm: false, online: true, clientId: null },
            { id: 4, name: 'Probe 4', location: 'Right · Lower', cps: 0, threshold: 1000, isAlarm: false, online: true, clientId: null }
        ];
        let activeCount = 2;
        let isPassing = false;

        function $(id) { return document.getElementById(id); }

        var UI = {
            probeOk: 'OK', probeAlarm: 'ALARM', probeOffline: 'OFF',
            resetBtn: '', resetBtnActive: '', sideTagOk: '', sideTagAlarm: '',
            latchNone: '', latchPending: '', vacant: '', passing: '', noMaster: '', clickDetail: 'Details >'
        };

        function applyUiLabels(ui) {
            if (!ui) return;
            for (var k in ui) { if (Object.prototype.hasOwnProperty.call(ui, k)) UI[k] = ui[k]; }
            var map = [
                ['systemTitle', 'title'], ['modeBadge', 'mode'], ['totalCpsLabel', 'totalCpsLabel'],
                ['probeSectionTitle', 'probeSection'], ['resetCardTitle', 'resetTitle'],
                ['labelRadStatus', 'radStatus'], ['labelAlarmLatch', 'alarmLatch'],
                ['healthCardTitle', 'healthTitle'], ['faultCardTitle', 'faultTitle'],
                ['kvProbeComm', 'kvProbeComm'], ['kvIrStatus', 'kvIrStatus'], ['kvMasterHw', 'kvMasterHw'],
                ['kvLastFault', 'kvLastFault'],
                ['detailLinkHealth', 'clickDetail'], ['detailLinkFault', 'clickDetail']
            ];
            for (var i = 0; i < map.length; i++) {
                var el = $(map[i][0]);
                if (el && UI[map[i][1]]) el.innerText = UI[map[i][1]];
            }
            var titleEl = $('systemTitle');
            if (titleEl && UI.titleTip) titleEl.title = UI.titleTip;
            var hc = $('card_health');
            if (hc && UI.tipHealth) hc.title = UI.tipHealth;
            var fc = $('card_fault');
            if (fc && UI.tipFault) fc.title = UI.tipFault;
            document.documentElement.style.setProperty('--detail-hint', UI.clickDetail || 'Details >');
            if (UI.title) document.title = UI.title;
        }

        var canReorder = false;
        var _drag = { from: -1, active: false, moved: false, startX: 0, startY: 0, el: null };

        function cpsDigitScale(text) {
            var s = String(text == null ? '' : text).replace(/,/g, '').trim();
            if (!s || s === '--') return 1;
            var n = s.length;
            if (n <= 5) return 1;
            if (n === 6) return 0.82;
            if (n === 7) return 0.68;
            return 0.55;
        }

        function applyCpsScale(el, text) {
            if (!el) return;
            el.style.setProperty('--cps-scale', String(cpsDigitScale(text)));
        }

        function _cpsRowOverflows(row) {
            return row.scrollWidth > row.clientWidth + 1;
        }

        function _shrinkCpsToFit(num, row, startScale) {
            var scale = startScale;
            num.style.setProperty('--cps-scale', String(scale));
            var n = 0;
            while (_cpsRowOverflows(row) && scale > 0.28 && n++ < 20) {
                scale *= 0.88;
                num.style.setProperty('--cps-scale', String(scale));
            }
            return scale;
        }

        function fitProbeCpsRows() {
            var rows = document.querySelectorAll('.probe-cps-row');
            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                var num = row.querySelector('.probe-num');
                if (!num || row.clientWidth <= 0) continue;
                var digit = cpsDigitScale(num.innerText);
                row.classList.remove('stacked');
                _shrinkCpsToFit(num, row, digit);
                if (_cpsRowOverflows(row)) {
                    row.classList.add('stacked');
                    _shrinkCpsToFit(num, row, digit);
                }
            }
        }

        function scheduleFitCps() {
            requestAnimationFrame(function () {
                requestAnimationFrame(fitProbeCpsRows);
            });
        }

        function setTotalCpsDisplay(total) {
            var el = $('totalCps');
            if (!el) return;
            el.innerText = total;
            applyCpsScale(el, total);
        }

        function renderProbes() {
            const container = $('probesContainer');
            container.innerHTML = '';
            const current = probes.slice(0, activeCount);
            let total = 0;
            current.forEach((probe, index) => {
                total += Number(probe.cps) || 0;
                const card = document.createElement('div');
                let cls = 'original-probe-card';
                if (probe.isAlarm) cls += ' alarm';
                else if (!probe.online) cls += ' offline';
                card.className = cls;
                card.dataset.index = String(index);
                const stateHtml = probe.isAlarm
                    ? '<span class="dot alarm"></span><span class="status-text-red">' + UI.probeAlarm + '</span>'
                    : (probe.online
                        ? '<span class="dot"></span><span class="status-text-green">' + UI.probeOk + '</span>'
                        : '<span class="dot offline"></span><span>' + UI.probeOffline + '</span>');
                const cpsShow = (probe.online || probe.cps) ? probe.cps : '--';
                card.innerHTML =
                    '<div class="probe-head">' +
                    '<span class="probe-name">' + probe.name + '</span>' +
                    '<span class="probe-location-tag">' + (probe.location || '') + '</span>' +
                    '</div>' +
                    '<div class="probe-body">' +
                    '<div class="probe-cps-row">' +
                    '<span class="probe-num">' + cpsShow + '</span>' +
                    '<span class="probe-unit-label">CPS</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="probe-foot">' +
                    '<div class="status-indicator">' + stateHtml + '</div>' +
                    '</div>';
                bindProbeCardInteractions(card, index, probe);
                applyCpsScale(card.querySelector('.probe-num'), cpsShow);
                container.appendChild(card);
            });
            if (!embedded) setTotalCpsDisplay(total);
            scheduleFitCps();
        }

        function clearDragOver() {
            var nodes = document.querySelectorAll('.original-probe-card.drag-over');
            for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove('drag-over');
        }

        function bindProbeCardInteractions(card, index, probe) {
            card.addEventListener('pointerdown', function (ev) {
                if (!canReorder) return;
                if (ev.button != null && ev.button !== 0) return;
                _drag.from = index;
                _drag.active = true;
                _drag.moved = false;
                _drag.startX = ev.clientX;
                _drag.startY = ev.clientY;
                _drag.el = card;
                try { card.setPointerCapture(ev.pointerId); } catch (e) {}
            });
            card.addEventListener('pointermove', function (ev) {
                if (!_drag.active || _drag.from < 0) return;
                var dx = ev.clientX - _drag.startX;
                var dy = ev.clientY - _drag.startY;
                if (!_drag.moved && (dx * dx + dy * dy) < 64) return;
                _drag.moved = true;
                if (_drag.el) _drag.el.classList.add('dragging');
                clearDragOver();
                var under = document.elementFromPoint(ev.clientX, ev.clientY);
                while (under && under !== document.body && !under.classList.contains('original-probe-card')) {
                    under = under.parentElement;
                }
                if (under && under.classList.contains('original-probe-card') && under !== _drag.el) {
                    under.classList.add('drag-over');
                }
            });
            function endDrag(ev) {
                if (!_drag.active) return;
                var from = _drag.from;
                var moved = _drag.moved;
                var src = _drag.el;
                _drag.active = false;
                _drag.from = -1;
                if (src) src.classList.remove('dragging');
                clearDragOver();
                try { if (src) src.releasePointerCapture(ev.pointerId); } catch (e) {}
                if (!moved) {
                    if (canNavigate && bridge && bridge.openProbe) {
                        bridge.openProbe(index, probe.clientId || '');
                    }
                    return;
                }
                var under = document.elementFromPoint(ev.clientX, ev.clientY);
                while (under && under !== document.body && !under.classList.contains('original-probe-card')) {
                    under = under.parentElement;
                }
                if (!under || !under.dataset || under === src) return;
                var to = parseInt(under.dataset.index, 10);
                if (isNaN(to) || to === from) return;
                var tmp = probes[from];
                probes[from] = probes[to];
                probes[to] = tmp;
                renderProbes();
                if (bridge && bridge.reorderProbes) bridge.reorderProbes(from, to);
            }
            card.addEventListener('pointerup', endDrag);
            card.addEventListener('pointercancel', endDrag);
        }

        function setProbeCount(count) {
            activeCount = count;
            renderProbes();
        }

        function triggerPassage() {
            if (isPassing) return;
            isPassing = true;
            $('personIcon').classList.add('passing');
            $('personIcon').innerText = '🚶';
            const badge = $('passageBadge');
            badge.className = 'passage-state-badge active';
            badge.innerText = '🏃 人员正在通行';
            setTimeout(function () {
                $('personIcon').classList.remove('passing');
                $('personIcon').innerText = '🚪';
                badge.className = 'passage-state-badge';
                badge.innerText = '🏃 通道空闲';
                isPassing = false;
            }, 3000);
        }

        function setPassage(busy, text, kind) {
            kind = kind || (busy ? 'passing' : 'vacant');
            isPassing = (kind === 'passing' || kind === 'alarm');
            const badge = $('passageBadge');
            const icon = $('personIcon');
            if (kind === 'alarm') {
                icon.classList.add('passing');
                icon.innerText = '🚶';
                badge.className = 'passage-state-badge alarm';
                badge.innerText = text || ('🏃 ' + (UI.occupiedAlarm || UI.passing || ''));
            } else if (kind === 'passing') {
                icon.classList.add('passing');
                icon.innerText = '🚶';
                badge.className = 'passage-state-badge active';
                badge.innerText = text || ('🏃 ' + (UI.passing || ''));
            } else if (kind === 'offline' || kind === 'ungated' || kind === 'noconn') {
                icon.classList.remove('passing');
                icon.innerText = '🚪';
                badge.className = 'passage-state-badge offline';
                badge.innerText = text || ('🚪 ' + (UI.noMaster || UI.vacant || ''));
            } else {
                icon.classList.remove('passing');
                icon.innerText = '🚪';
                badge.className = 'passage-state-badge';
                badge.innerText = text || ('🏃 ' + (UI.vacant || ''));
            }
        }

        function setResetStyle(active, enabled) {
            const btn = $('resetBtn');
            if (active) {
                btn.className = 'reset-btn active';
                $('resetIcon').innerText = '\u26a0';
                $('resetBtnText').innerText = UI.resetBtnActive;
                $('sideHeaderTag').innerText = UI.sideTagAlarm;
                $('sideHeaderTag').style.color = '#FF4D4D';
                $('alarmLatchStatus').innerText = UI.latchPending;
                $('alarmLatchStatus').style.color = '#FF4D4D';
            } else {
                btn.className = 'reset-btn normal';
                $('resetIcon').innerText = '\u21ba';
                $('resetBtnText').innerText = UI.resetBtn;
                $('sideHeaderTag').innerText = UI.sideTagOk;
                $('sideHeaderTag').style.color = 'var(--hmi-ok)';
                $('alarmLatchStatus').innerText = UI.latchNone;
                $('alarmLatchStatus').style.color = '#DDD';
            }
            btn.disabled = (enabled === false);
        }


                function layoutSidebarCards() {
            var cards = [
                document.getElementById('card_alarm'),
                document.getElementById('card_health'),
                document.getElementById('card_fault')
            ];
            cards.forEach(function (el) {
                if (!el) return;
                el.style.removeProperty('height');
                el.style.removeProperty('max-height');
                el.style.removeProperty('min-height');
                el.style.setProperty('flex', '1 1 0%', 'important');
                el.style.setProperty('overflow', 'hidden', 'important');
            });
        }

        function setAlarmBanner(state) {
            const banner = $('alarmBanner');
            const header = $('mainHeader');
            banner.className = 'master-alarm-banner';
            header.className = 'header';
            if (state === 'alarm') {
                banner.classList.add('alarm');
                header.classList.add('global-alarm');
                $('alarmIcon').innerHTML = "<svg viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M12 3L22 20H2L12 3Z' fill='var(--hmi-alarm)' stroke='#FFAAAA' stroke-width='1.2'/><path d='M12 9V14' stroke='#fff' stroke-width='2.2' stroke-linecap='round'/><circle cx='12' cy='17.2' r='1.2' fill='#fff'/></svg>";
            } else if (state === 'warn' || state === 'offline') {
                banner.classList.add('warn');
                $('alarmIcon').innerHTML = "<svg viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M12 3L22 20H2L12 3Z' fill='var(--hmi-warn)' stroke='#FDE68A' stroke-width='1.2'/><path d='M12 9V14' stroke='#111' stroke-width='2.2' stroke-linecap='round'/><circle cx='12' cy='17.2' r='1.2' fill='#111'/></svg>";
            } else {
                $('alarmIcon').innerHTML = "<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><circle cx='12' cy='12' r='10' fill='#059669'/><path d='M7 12.5l3 3 7-7' stroke='#fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>";
            }
        }

        function triggerAlarm() {
            probes[0].cps = 3240;
            probes[0].isAlarm = true;
            setAlarmBanner('alarm');
            $('alarmText').innerText = '危险：1号探头辐射计数率超限！';
            $('alarmSubText').innerText = '当前数值 3240 CPS（已超出阈值 1000 CPS），请立即核查！';
            $('sideRadStat').innerText = '1号探头超限';
            $('sideRadStat').className = 'info-value red-flash';
            setResetStyle(true, true);
            renderProbes();
        }

        function handleReset() {
            if (bridge && bridge.requestReset) {
                bridge.requestReset();
                return;
            }
            probes[0].cps = 402;
            probes[0].isAlarm = false;
            setAlarmBanner('normal');
            $('alarmText').innerText = '系统正常';
            $('alarmSubText').innerText = '所有通道探头实时数值均低于安全阈值';
            $('sideRadStat').innerText = '全组正常';
            $('sideRadStat').className = 'info-value green';
            setResetStyle(false, false);
            renderProbes();
        }

        function openPage(pageType) {
            if (!bridge) return;
            if (pageType === 'fault' && bridge.openFault) { bridge.openFault(); return; }
            if (pageType === 'health' && bridge.openHealth) { bridge.openHealth(); return; }
        }
        function closePage() { $('pageModal').classList.remove('active'); }


        /** Python demo / backend: updateCpsData(cps1, cps2, ...) */
        window.updateCpsData = function () {
            var args = Array.prototype.slice.call(arguments);
            if (!args.length) return;
            for (var i = 0; i < args.length; i++) {
                if (!probes[i]) {
                    probes[i] = {
                        id: i + 1,
                        name: 'Probe ' + (i + 1),
                        location: '',
                        cps: 0,
                        threshold: 1000,
                        isAlarm: false,
                        online: true,
                        clientId: null
                    };
                }
                probes[i].cps = Number(args[i]) || 0;
                probes[i].online = true;
            }
            activeCount = Math.max(activeCount, args.length);
            var total = 0;
            for (var j = 0; j < activeCount; j++) total += Number(probes[j].cps) || 0;
            setTotalCpsDisplay(total);
            renderProbes();
        };

        /** Alias for simple demos: updateData(cps1, cps2) */
        window.updateData = function (cps1, cps2) {
            return window.updateCpsData(cps1, cps2);
        };

        window.applyHmiState = function (state) {
            if (!state) return;
            embedded = true;
            document.body.classList.add('embedded');
            setTimeout(function () {
                layoutSidebarCards();
                scheduleFitCps();
            }, 0);

            if (state.ui) applyUiLabels(state.ui);
            canNavigate = !!state.canNavigate;
            canReorder = !!state.canReorder;
            canOpenAlarmLog = (state.canOpenAlarmLog !== false);
            document.body.classList.toggle('nav-enabled', canNavigate);
            document.body.classList.toggle('can-reorder', canReorder);
            document.body.classList.toggle('alarm-log-enabled', canOpenAlarmLog);
            var ghost = $('ghostLogin');
            if (ghost) ghost.style.display = canNavigate ? 'none' : '';
            if (state.modeLabel) { var mb0 = $('modeBadge'); if (mb0) mb0.innerText = state.modeLabel; }

            if (state.totalCps != null) setTotalCpsDisplay(state.totalCps);
            if (state.masterLink) {
                const el = $('masterLink');
                el.innerText = state.masterLink.text || '';
                el.className = 'status-online';
                if (state.masterLink.level === 'warn') el.classList.add('status-warn');
                if (state.masterLink.level === 'offline') el.classList.add('status-offline');
            }
            if (Array.isArray(state.probes)) {
                probes = state.probes.map(function (p, i) {
                    return {
                        id: i + 1,
                        name: p.name || ('Probe ' + (i + 1)),
                        location: p.location || '',
                        cps: p.cps || 0,
                        threshold: p.threshold || 1000,
                        isAlarm: !!p.isAlarm,
                        online: p.online !== false,
                        clientId: p.clientId || null
                    };
                });
                activeCount = probes.length;
                renderProbes();
            }
            if (state.alarm) {
                setAlarmBanner(state.alarm.kind || 'normal');
                if (state.alarm.title) $('alarmText').innerText = state.alarm.title;
                if (state.alarm.desc) $('alarmSubText').innerText = state.alarm.desc;
                setResetStyle(!!state.alarm.latched, state.alarm.resetEnabled !== false && !!state.alarm.latched);
                if (state.alarm.sideTag) {
                    $('sideHeaderTag').innerText = state.alarm.sideTag;
                    if (state.alarm.sideTagColor) $('sideHeaderTag').style.color = state.alarm.sideTagColor;
                }
                if (state.alarm.sideRad) {
                    $('sideRadStat').innerText = state.alarm.sideRad;
                    var radClass = 'info-value green';
                    if (state.alarm.latched) radClass = 'info-value red-flash';
                    else if (state.alarm.kind === 'offline' || state.alarm.kind === 'warn') radClass = 'info-value amber';
                    $('sideRadStat').className = radClass;
                }
                if (state.alarm.latchText) {
                    var ls = $('alarmLatchStatus');
                    if (ls) {
                        ls.innerText = state.alarm.latchText;
                        if (state.alarm.clearModeLatch && state.alarm.latched) ls.style.color = '#FF4D4D';
                        else if (state.alarm.latched) ls.style.color = 'var(--hmi-warn)';
                        else ls.style.color = '#DDD';
                    }
                }
            }
            if (state.passage) setPassage(!!state.passage.busy, state.passage.text, state.passage.kind);
            if (state.health) {
                var hs = state.health.status || '';
                if (state.health.warn && hs && hs.indexOf('\u26a0') < 0) hs = '\u26a0 ' + hs;
                $('healthStatusTag').innerText = hs;
                $('healthStatusTag').style.color = state.health.color || 'var(--hmi-ok)';
                var rows = state.health.rows || {};
                function setKv(id, text, tone) {
                    var el = $(id);
                    if (!el) return;
                    el.innerText = text || '';
                    el.className = 'kv-val' + (tone ? (' ' + tone) : '');
                }
                setKv('healthProbeComm', rows.probeComm || '', rows.probeTone || 'green');
                setKv('healthIrStatus', rows.irStatus || '', rows.irTone || 'green');
                setKv('healthMasterHw', rows.masterHw || '', rows.masterTone || 'green');
                $('card_health').className = 'side-card clickable-card' + (state.health.warn ? ' warn' : '');
            }
            if (state.fault) {
                $('faultCountTag').innerText = state.fault.status || '';
                $('faultCountTag').style.color = state.fault.color || 'var(--hmi-ok)';
                var frows = state.fault.rows || {};
                var lastEl = $('lastFaultText');
                if (lastEl) {
                    lastEl.innerText = frows.lastFault || state.fault.desc || '';
                    lastEl.className = 'kv-val multiline' + (frows.lastTone ? (' ' + frows.lastTone) : '');
                }
                $('card_fault').className = 'side-card clickable-card' + (state.fault.warn ? ' warn' : '');
            }

            if (state.battery != null) {
                var b = $('batteryTag');
                if (b) b.innerText = state.battery;
            }
            if (state.langLabel) {
                var lb = $('langBtn');
                if (lb) lb.innerText = state.langLabel;
            }
            if (state.modeLabel) {
                var mb = $('modeBadge');
                if (mb) mb.innerText = state.modeLabel;
            }
        };


        function toggleLang() {
            if (bridge && bridge.toggleLanguage) bridge.toggleLanguage();
        }

        function doLogin() {
            if (bridge && bridge.requestLogin) bridge.requestLogin();
        }

        function initBridge() {
            if (typeof qt === 'undefined' || !qt.webChannelTransport) return;
            new QWebChannel(qt.webChannelTransport, function (channel) {
                bridge = channel.objects.bridge;
                document.body.classList.add('embedded');
                embedded = true;
                layoutSidebarCards();
                window.addEventListener('resize', function () {
                    layoutSidebarCards();
                    scheduleFitCps();
                });
                if (bridge && bridge.pageReady) bridge.pageReady();
            });
        }

        $('systemTitle').addEventListener('dblclick', function () {
            if (bridge && bridge.requestLogin) bridge.requestLogin();
        });

        setInterval(function () {
            const now = new Date();
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            $('clock').innerText = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        }, 1000);

        renderProbes();
        initBridge();
    </script>
</body>
</html>
